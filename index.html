<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pandata Solutions - Design Concepts</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        p {
            color: #94a3b8;
            margin-bottom: 3rem;
        }
        .cards {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 2rem;
            width: 280px;
            text-decoration: none;
            color: white;
            transition: all 0.3s;
            border: 1px solid #334155;
        }
        .card:hover {
            transform: translateY(-8px);
            border-color: #4ade80;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .card h2 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .card p {
            font-size: 0.875rem;
            margin-bottom: 0;
        }
        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        .v1 .badge { background: #4ade80; color: #0a1628; }
        .v2 .badge { background: #22c55e; color: white; }
        .v3 .badge { background: #c2410c; color: white; }
    </style>
</head>
<body>
    <h1>Pandata Solutions</h1>
    <p>Landing Page Design Concepts</p>
    
    <div class="cards">
        <a href="v1-foundation.html" class="card v1">
            <span class="badge">V1</span>
            <h2>Foundation</h2>
            <p>Dark theme with geometric blocks. Enterprise credibility focus.</p>
        </a>
        
        <a href="v2-velocity.html" class="card v2">
            <span class="badge">V2</span>
            <h2>Velocity</h2>
            <p>Light theme with motion graphics. Speed and efficiency focus.</p>
        </a>
        
        <a href="v3-studio.html" class="card v3">
            <span class="badge">V3</span>
            <h2>Studio</h2>
            <p>Warm organic theme. Craft and collaboration focus.</p>
        </a>
    </div>
</body>
</html>
